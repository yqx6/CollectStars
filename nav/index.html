<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>站点导航 · xiaoluabc.top</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f172a; color: #e2e8f0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; min-height: 100vh; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 32px 16px 60px; }
  header { text-align: center; margin-bottom: 24px; }
  header h1 { font-size: 26px; }
  .stats { display: flex; gap: 12px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  .stat { background: #1e293b; border-radius: 10px; padding: 8px 18px; font-size: 14px; color: #94a3b8; }
  .stat b { color: #38bdf8; font-size: 20px; margin: 0 2px; }
  .toolbar { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .btn { border: none; border-radius: 10px; padding: 9px 18px; font-size: 14px; cursor: pointer; background: #1e293b; color: #e2e8f0; }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: #38bdf8; color: #082f49; font-weight: bold; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .card { background: #1e293b; border-radius: 14px; padding: 16px; display: flex; gap: 12px; align-items: flex-start; border: 1px solid transparent; }
  .card:hover { border-color: #334155; }
  .icon { font-size: 32px; line-height: 1; width: 44px; text-align: center; flex-shrink: 0; }
  .info { flex: 1; min-width: 0; }
  .name { font-size: 16px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .path { font-size: 12px; color: #38bdf8; margin-top: 2px; word-break: break-all; }
  .desc { font-size: 12px; color: #94a3b8; margin-top: 4px; line-height: 1.5; }
  .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .dot { font-size: 12px; color: #94a3b8; }
  .dot i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #475569; margin-right: 5px; }
  .dot.on i { background: #22c55e; box-shadow: 0 0 8px rgba(34,197,94,.8); }
  .dot.on { color: #86efac; }
  .go { text-decoration: none; background: #38bdf8; color: #082f49; font-weight: bold; font-size: 13px; border-radius: 8px; padding: 7px 16px; }
  .ops { display: flex; gap: 8px; margin-top: 10px; }
  .op { flex: 1; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; border-radius: 8px; padding: 7px 0; font-size: 13px; cursor: pointer; }
  .op:active { transform: scale(.97); }
  .op.danger { color: #f87171; border-color: #7f1d1d; }
  .error { background: #7f1d1d; border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; font-size: 14px; display: none; }
  .empty { text-align: center; color: #94a3b8; margin: 24px 0; }
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .mask.show { display: flex; }
  .modal { background: #1e293b; border-radius: 14px; padding: 20px; width: 100%; max-width: 380px; }
  .modal h3 { font-size: 17px; margin-bottom: 12px; }
  .modal label { display: block; font-size: 13px; color: #94a3b8; margin: 10px 0 4px; }
  .modal input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 15px; outline: none; }
  .modal input:focus { border-color: #38bdf8; }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .modal-actions .btn { flex: 1; }
  footer { text-align: center; color: #475569; font-size: 12px; margin-top: 28px; line-height: 1.8; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧭 站点导航</h1>
    <div class="stats">
      <div class="stat">共部署 <b id="total">0</b> 个站点</div>
      <div class="stat">在线 <b id="online">0</b> 个</div>
    </div>
  </header>
  <div class="toolbar">
    <button class="btn primary" id="addBtn">＋ 添加站点</button>
    <button class="btn" id="resetBtn">恢复默认</button>
  </div>
  <div class="error" id="error"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">暂无站点，点击上方"添加站点"</div>
  <footer>数据入库 Mongo，多端同步 · 修改 / 删除实时生效<br/>xiaoluabc.top/nav</footer>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <h3 id="modalTitle">添加站点</h3>
    <label>名称（可重命名）</label>
    <input id="fName" maxlength="20" placeholder="例如：打卡集星星" />
    <label>路径（以 / 开头）</label>
    <input id="fPath" maxlength="60" placeholder="例如：/star/" />
    <label>图标（单个 emoji）</label>
    <input id="fIcon" maxlength="8" placeholder="例如：⭐" />
    <label>描述</label>
    <input id="fDesc" maxlength="60" placeholder="例如：Vue3 + Express + Mongo" />
    <div class="modal-actions">
      <button class="btn" id="cancelBtn">取消</button>
      <button class="btn primary" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<script>
var API = "/nav/api";
var grid = document.getElementById("grid");
var emptyEl = document.getElementById("empty");
var errorEl = document.getElementById("error");
var mask = document.getElementById("mask");
var editingId = null;

function showError(msg) {
  errorEl.style.display = "block";
  errorEl.textContent = msg;
}
function hideError() { errorEl.style.display = "none"; }

function api(method, url, body) {
  return fetch(API + url, {
    method: method,
    headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined
  }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (d) {
      if (!r.ok) throw new Error(d.message || ("HTTP " + r.status));
      return d;
    });
  });
}

function probe(card, path) {
  var dot = card.querySelector(".dot");
  fetch(path, { method: "HEAD", cache: "no-store" }).then(function (r) {
    if (r.ok) {
      dot.classList.add("on");
      dot.innerHTML = "<i></i>在线";
      var el = document.getElementById("online");
      el.textContent = Number(el.textContent) + 1;
    } else {
      dot.innerHTML = "<i></i>" + r.status;
    }
  }).catch(function () { dot.innerHTML = "<i></i>离线"; });
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

function render(sites) {
  grid.innerHTML = "";
  document.getElementById("total").textContent = sites.length;
  document.getElementById("online").textContent = "0";
  emptyEl.style.display = sites.length ? "none" : "block";
  sites.forEach(function (s) {
    var card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      '<div class="icon">' + esc(s.icon || "🌐") + "</div>" +
      '<div class="info">' +
        '<div class="name">' + esc(s.name) + "</div>" +
        '<div class="path">' + esc(s.path) + "</div>" +
        '<div class="desc">' + esc(s.desc || "") + "</div>" +
        '<div class="foot"><span class="dot"><i></i>检测中</span>' +
        '<a class="go" href="' + esc(s.path) + '">前往 →</a></div>' +
        '<div class="ops"><button class="op editBtn">修改</button>' +
        '<button class="op danger delBtn">删除</button></div>' +
      "</div>";
    card.querySelector(".editBtn").onclick = function () { openModal(s); };
    card.querySelector(".delBtn").onclick = function () {
      if (!confirm("确定删除「" + s.name + "」吗？")) return;
      api("DELETE", "/sites/" + s._id).then(load).catch(function (e) { showError("删除失败：" + e.message); });
    };
    grid.appendChild(card);
    probe(card, s.path);
  });
}

function load() {
  hideError();
  api("GET", "/sites").then(render).catch(function (e) {
    showError("接口异常：" + e.message + "，检查 nav-backend 容器与 /nav/api/ 反代");
  });
}

function openModal(s) {
  editingId = s ? s._id : null;
  document.getElementById("modalTitle").textContent = s ? "修改站点" : "添加站点";
  document.getElementById("fName").value = s ? s.name : "";
  document.getElementById("fPath").value = s ? s.path : "";
  document.getElementById("fIcon").value = s ? (s.icon || "") : "";
  document.getElementById("fDesc").value = s ? (s.desc || "") : "";
  mask.classList.add("show");
}
function closeModal() { mask.classList.remove("show"); }

document.getElementById("addBtn").onclick = function () { openModal(null); };
document.getElementById("cancelBtn").onclick = closeModal;
mask.onclick = function (e) { if (e.target === mask) closeModal(); };
document.getElementById("saveBtn").onclick = function () {
  var body = {
    name: document.getElementById("fName").value.trim(),
    path: document.getElementById("fPath").value.trim(),
    icon: document.getElementById("fIcon").value.trim(),
    desc: document.getElementById("fDesc").value.trim()
  };
  var p = editingId
    ? api("PUT", "/sites/" + editingId, body)
    : api("POST", "/sites", body);
  p.then(function () { closeModal(); load(); }).catch(function (e) { showError("保存失败：" + e.message); });
};
document.getElementById("resetBtn").onclick = function () {
  if (!confirm("恢复为默认 7 个站点？当前修改将丢失。")) return;
  api("POST", "/reset").then(load).catch(function (e) { showError("恢复失败：" + e.message); });
};

load();
</script>
</body>
</html>
